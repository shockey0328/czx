<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橙子学数据看板</title>
  <link rel="stylesheet" href="weekly-dashboard-theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="portal-header">
    <div class="portal-brand">
      <img src="logo.png" alt="橙子学" class="portal-logo">
      <span class="portal-title">橙子学数据看板</span>
    </div>
    <nav class="portal-nav">
      <div class="period-toggle" role="group" aria-label="数据周期">
        <button class="period-btn active" data-period="weekly">周度</button>
        <button class="period-btn" data-period="monthly">月度</button>
      </div>
      <select id="dashboardType" class="portal-select" aria-label="选择看板">
        <option value="core-weekly">核心数据</option>
        <option value="user-growth-weekly">用户增长</option>
        <option value="search-weekly">搜索数据</option>
        <option value="user-behavior-weekly">用户行为</option>
      </select>
    </nav>
  </header>

  <main id="dashboardContainer" class="portal-stage">
    <div class="portal-loading">
      <span class="portal-spinner" aria-hidden="true"></span>
      <span class="portal-loading-text">正在加载看板…</span>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
