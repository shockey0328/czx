<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度核心数据看板</title>
    <link rel="stylesheet" href="../weekly-dashboard-theme.css">
    <!-- 使用本地Chart.js -->
    <script src="../libs/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-5);
        }

        /** KPI 总区：紧凑排版，减少纵向占用 */
        .month-kpi-region {
            margin-bottom: var(--space-4);
        }

        .month-kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
        }

        .metric-section-title {
            font-size: 17px;
            font-weight: 700;
            margin: 0;
            color: var(--color-text);
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 107, 53, 0.32);
            background: var(--color-surface);
            color: var(--color-primary);
            font-size: 12px;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .copy-btn:hover {
            background: var(--color-primary-soft);
        }

        .copy-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.18);
        }

        .copy-btn.copied {
            background: var(--color-primary);
            color: #fff;
            border-color: transparent;
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .metrics-board {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            margin-bottom: var(--space-4);
        }

        .metric-cluster {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
        }

        .metric-cluster-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-muted);
            letter-spacing: 0.08em;
            margin: 0 0 var(--space-2);
            padding-bottom: var(--space-1);
            border-bottom: 1px solid var(--color-border);
            width: 100%;
            box-sizing: border-box;
        }

        .metric-cluster-grid {
            display: grid;
            gap: var(--space-2);
        }

        /** 「商业化」「活跃与会员」并排一行 */
        .metric-cluster-row--pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-5);
            width: 100%;
            align-items: start;
        }

        .metric-cluster--full {
            width: 100%;
        }

        .metric-cluster--half {
            width: 100%;
            min-width: 0;
        }

        /** 每列内 2 张卡均分宽度 */
        .metric-cluster-grid--2 {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--space-3);
        }

        .metric-cluster-grid--3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            gap: var(--space-3);
        }

        @media (max-width: 900px) {
            .metric-cluster-row--pair {
                grid-template-columns: 1fr;
                gap: var(--space-4);
            }
        }

        .metric-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-left: 3px solid var(--color-primary);
            border-radius: var(--radius-sm);
            padding: var(--space-3) var(--space-3);
            box-shadow: var(--shadow-sm);
            color: var(--color-text);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 0;
        }

        .metric-card:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(255, 107, 53, 0.28);
        }

        .metric-card .label {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .metric-card .value {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--color-primary);
            font-variant-numeric: tabular-nums;
            margin-bottom: 2px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .metric-card .change {
            font-size: 11px;
            margin-top: 4px;
            padding: 2px 6px;
            background: var(--color-well);
            border-radius: 6px;
            display: inline-block;
        }

        /* 变化指标样式（中国风格：红涨绿跌） */
        .changes {
            display: flex;
            gap: 6px;
            margin-top: auto;
            padding-top: 2px;
            flex-wrap: wrap;
            justify-content: flex-start;
            width: 100%;
        }

        .change-item {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            background: var(--color-well);
            color: var(--color-text);
        }

        .change-item.positive {
            background: rgba(255, 235, 238, 0.8);
            color: #d32f2f;  /* 红色表示上涨 */
        }

        .change-item.negative {
            background: rgba(232, 245, 232, 0.8);
            color: #388e3c;  /* 绿色表示下跌 */
        }

        .chart-section {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
            box-shadow: var(--shadow-sm);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: var(--space-5);
            padding-bottom: var(--space-3);
            border-bottom: 2px solid var(--color-border);
            letter-spacing: -0.02em;
        }

        .chart-container {
            height: 400px;
            position: relative;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
        }

        .trends-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .trends-header .chart-title {
            margin-bottom: 0;
        }

        .month-kpi-header .chart-title {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        /* 趋势图网格 */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-4);
        }

        .chart-item {
            background: var(--color-well);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: var(--space-3);
        }

        .chart-item h5 {
            color: var(--color-text);
            margin-bottom: 8px;
            font-size: 14px;
            text-align: center;
        }

        /* B端数据卡片 */
        .b2b-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .b2b-metric-card {
            background: var(--color-surface);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            border: 1px solid var(--color-border);
            border-top: 3px solid var(--color-primary-mid);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 132px;
        }

        .b2b-metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
        }

        .b2b-metric-label {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }

        .b2b-metric-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-primary);
            font-variant-numeric: tabular-nums;
        }

        .b2b-metric-card .changes {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        /* AI分析样式 */
        .ai-analysis {
            margin-top: 24px;
        }

        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .refresh-btn {
            padding: 6px 16px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-family: var(--font-sans);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .refresh-btn:hover {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.22);
        }

        .ai-content {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 15px;
            min-height: 200px;
        }

        .ai-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .analysis-section h5 {
            color: var(--color-primary);
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--color-primary);
        }

        .analysis-content {
            background: var(--color-well);
            border-radius: 6px;
            padding: 12px;
            border-left: 3px solid var(--color-primary);
        }

        .analysis-text {
            font-size: 12px;
            line-height: 1.6;
            color: var(--color-text-muted);
        }

        .analysis-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .analysis-list li {
            margin-bottom: 8px;
            padding-left: 12px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--color-text-muted);
            position: relative;
        }

        .analysis-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--color-primary);
            font-weight: bold;
        }

        .ai-footer {
            display: flex;
            justify-content: flex-end;
            padding: 10px 0 0 0;
        }

        .ai-credit {
            font-size: 11px;
            color: #999;
        }

        .loading {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px 20px;
            font-size: 14px;
        }

        /* 小橙子AI助手样式 */
        .ai-assistant {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
        }

        .ai-assistant-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 25px rgba(255, 107, 53, 0.25);
            border: 3px solid var(--color-primary);
            transition: all 0.3s ease;
            position: relative;
        }

        .ai-assistant-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.35);
        }

        .ai-assistant-avatar {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        .ai-assistant-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 107, 53, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        /* AI对话框样式 */
        .ai-chat-modal {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 380px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 1001;
            overflow: hidden;
        }

        .ai-chat-modal.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }

        .ai-chat-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .ai-chat-header {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-mid));
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-chat-avatar img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            padding: 4px;
        }

        .ai-chat-info h4 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .ai-chat-info span {
            font-size: 12px;
            opacity: 0.9;
        }

        .ai-chat-close {
            margin-left: auto;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .ai-chat-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .ai-chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--color-well);
        }

        .ai-message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .ai-message.user {
            flex-direction: row-reverse;
        }

        .ai-message-avatar img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            background: white;
            border: 1px solid var(--color-primary);
            border-radius: 6px;
            padding: 2px;
        }

        .user-message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .ai-message-content {
            flex: 1;
            max-width: 280px;
        }

        .ai-message.user .ai-message-content {
            text-align: right;
        }

        .ai-message-bubble {
            background: white;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .ai-message.user .ai-message-bubble {
            background: var(--color-primary);
            color: white;
        }

        .ai-message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 4px;
        }

        .ai-message.user .ai-message-time {
            text-align: right;
        }

        .ai-chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .ai-chat-suggestions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .suggestion-btn {
            background: #f0f0f0;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: var(--color-primary);
            color: white;
        }

        .ai-chat-input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .ai-chat-input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .ai-chat-input-container input:focus {
            border-color: var(--color-primary);
        }

        .ai-chat-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--color-primary);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 12px;
        }

        .ai-chat-send-btn:hover {
            background: #e55a2b;
            transform: scale(1.05);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-primary);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
            
            .metric-cluster-grid--3 {
                grid-template-columns: 1fr;
            }

            
            .grid-2, .charts-grid, .b2b-grid, .ai-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-container {
                height: 300px;
            }
            
            .trend-range-toggle {
                flex-wrap: wrap;
            }
            
            .trend-range-toggle .trend-range-btn {
                font-size: 11px;
                padding: 4px 12px;
            }
            
            /* 移动端AI助手调整 */
            .ai-assistant {
                left: 15px;
                bottom: 80px;
                top: auto;
                transform: none;
            }
            
            .ai-assistant-button {
                width: 60px;
                height: 60px;
            }
            
            .ai-assistant-avatar {
                width: 42px;
                height: 42px;
            }
            
            .ai-chat-modal {
                left: 15px;
                right: 15px;
                top: 50px;
                bottom: 50px;
                width: auto;
                height: auto;
                transform: none;
            }
            
            .ai-chat-modal.show {
                animation: slideInUp 0.3s ease;
            }
            
            @keyframes slideInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

        @media (max-width: 520px) {
            .metric-cluster-grid--3,
            .metric-cluster-grid--2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="dashboard-page-body">
    <header class="navbar">
        <div class="brand-block">
            <div class="logo-text">月度核心数据</div>
        </div>
        <div class="nav-actions">
            <span class="week-context" id="monthContextBar" aria-live="polite">—</span>
            <select class="week-dropdown month-dropdown" id="monthSelector" aria-label="选择月份">
            </select>
        </div>
    </header>

    <main class="container" id="dashboard-main" aria-label="月度核心数据">
        <section class="month-kpi-region" aria-labelledby="month-sec-kpi">
            <div class="month-kpi-header">
                <h2 id="month-sec-kpi" class="metric-section-title">核心指标</h2>
                <button type="button" class="copy-btn" id="copyMetricsBtn" aria-label="复制核心指标到剪贴板">
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <rect x="5" y="5" width="8" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M3 11V3.5C3 2.94772 3.44772 2.5 4 2.5H10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                    <span class="copy-btn-text">复制</span>
                </button>
            </div>
            <div class="metrics-board" id="metricsGrid"></div>
        </section>

        <section class="chart-section" aria-labelledby="month-sec-trends">
            <div class="trends-header">
                <h2 class="chart-title" id="month-sec-trends">趋势分析</h2>
                <div class="period-selector trend-range-toggle" role="group" aria-label="趋势时间范围">
                    <button type="button" class="trend-range-btn active" data-months="3">近3个月</button>
                    <button type="button" class="trend-range-btn" data-months="6">近6个月</button>
                    <button type="button" class="trend-range-btn" data-months="12">近12个月</button>
                </div>
            </div>
            <div class="charts-grid">
                <div class="chart-item">
                    <h5>月活趋势</h5>
                    <div class="chart-container">
                        <canvas id="mauChart"></canvas>
                    </div>
                </div>
                <div class="chart-item">
                    <h5>营收趋势</h5>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
                <div class="chart-item">
                    <h5>留存率趋势</h5>
                    <div class="chart-container">
                        <canvas id="retentionChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <section class="chart-section" aria-labelledby="month-sec-b2b">
            <div class="month-kpi-header">
                <h2 class="chart-title" id="month-sec-b2b">B端核心数据</h2>
                <button type="button" class="copy-btn" id="copyB2bBtn" aria-label="复制B端核心数据到剪贴板">
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <rect x="5" y="5" width="8" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/>

    <script src="data.js"></script>
    <script>
        let monthlyData = [];
        let bData = []; // B端数据
        let currentMonth = null;
        let charts = {};

        function safeParseIntCell(val) {
            if (val == null || String(val).trim() === '') return null;
            const n = parseInt(String(val).replace(/,/g, '').trim(), 10);
            return Number.isFinite(n) ? n : null;
        }
        function safeParseFloatCell(val) {
            if (val == null || String(val).trim() === '') return null;
            const n = parseFloat(String(val).replace(/,/g, '').trim());
            return Number.isFinite(n) ? n : null;
        }
        function safeParsePercentCell(val) {
            if (val == null || String(val).trim() === '') return null;
            const n = parseFloat(String(val).replace(/%/g, '').trim());
            return Number.isFinite(n) ? n : null;
        }
        function parseB2BWanAmount(val) {
            if (val == null || String(val).trim() === '') return null;
            const n = parseFloat(String(val).replace(/万/g, '').trim());
            return Number.isFinite(n) ? n : null;
        }
        function findB2BRow(yearStr, monthStr) {
            return bData.find(d => d.年份 === yearStr && d.月份 === monthStr);
        }
        function getB2BPrevMonthRow(yearStr, monthStr) {
            let y = parseInt(String(yearStr).replace('年', ''), 10);
            let m = parseInt(String(monthStr).replace('月', ''), 10);
            m -= 1;
            if (m < 1) { y -= 1; m = 12; }
            return findB2BRow(y + '年', m + '月');
        }
        function getB2BYoYRow(yearStr, monthStr) {
            const y = parseInt(String(yearStr).replace('年', ''), 10) - 1;
            return findB2BRow(y + '年', monthStr);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setupAIAssistant(); // 初始化AI助手
        });

        // 加载数据
        function loadData() {
            console.log('加载月度数据...');
            
            if (typeof dashboardData !== 'undefined' && dashboardData['月度核心数据']) {
                monthlyData = dashboardData['月度核心数据'].map(row => ({
                    年份: row['年份'],
                    月份: row['月份'],
                    月活: safeParseIntCell(row['月活']),
                    新增用户: safeParseIntCell(row['新增用户']),
                    次月留存: safeParsePercentCell(row['次月留存']),
                    营收: safeParseFloatCell(row['营收']),
                    订单: safeParseIntCell(row['订单']),
                    ARPU: safeParseFloatCell(row['ARPU']),
                    ARPPU: safeParseFloatCell(row['ARPPU']),
                    深度访问率: safeParsePercentCell(row['深度访问率']),
                    使用率: safeParsePercentCell(row['使用率']),
                    大会员活跃率: safeParsePercentCell(row['大会员活跃率'])
                }));
                
                console.log('月度数据加载成功，共', monthlyData.length, '条');
                
                // 加载B端数据
                if (dashboardData['B端核心数据']) {
                    bData = dashboardData['B端核心数据'].map(row => ({
                        年份: row['年份'],
                        月份: row['月份'],
                        签约金额: row['签约金额'],
                        开票金额: row['开票金额'],
                        到款金额: row['到款金额'],
                        订单数: row['订单数'],
                        新签: row['新签'],
                        续签: row['续签']
                    }));
                    console.log('B端数据加载成功，共', bData.length, '条');
                }
                
                initializeDashboard();
            } else {
                console.error('未找到月度核心数据');
                alert('数据加载失败，请运行"更新数据.bat"');
            }
        }

        // 初始化看板
        function initializeDashboard() {
            // 生成月份选择器（倒序：最新月份在上）
            const selector = document.getElementById('monthSelector');
            const options = monthlyData.map((item, index) => ({
                index,
                label: `${item.年份}年${item.月份}`
            })).reverse();
            options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt.index;
                option.textContent = opt.label;
                selector.appendChild(option);
            });
            
            // 默认选择最新月份（倒序列表的第一个）
            currentMonth = monthlyData.length - 1;
            selector.value = String(currentMonth);
            
            // 监听选择器变化
            selector.addEventListener('change', function() {
                currentMonth = parseInt(this.value);
                updateDashboard();
            });
            
            // 设置时间范围选择器
            document.querySelectorAll('.trend-range-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.trend-range-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    updateCharts();
                });
            });

            setupCopyMetricsButton();
            setupCopyB2bButton();
            
            // 初始化显示
            updateDashboard();
        }

        function updateMonthContextBar() {
            const el = document.getElementById('monthContextBar');
            if (!el || !monthlyData || monthlyData.length === 0 || currentMonth == null) return;
            const d = monthlyData[currentMonth];
            if (!d) return;
            el.textContent = `${d.年份}年${d.月份}`;
        }

        // 更新看板
        function updateDashboard() {
            updateMonthContextBar();
            updateMetrics();
            updateCharts();
            updateB2BMetrics();
            generateAIAnalysis(); // 生成AI分析
        }

        // 更新指标卡片
        function updateMetrics() {
            const data = monthlyData[currentMonth];
            const prevData = currentMonth > 0 ? monthlyData[currentMonth - 1] : null;
            const yoyData = getYoYData(data);
            
            const fmtInt = (n) => (n != null && !isNaN(n)) ? Number(n).toLocaleString() : '—';
            const fmtPct = (n) => (n != null && !isNaN(n)) ? n + '%' : '—';
            const fmtWanFromYuan = (n) => (n != null && !isNaN(n)) ? (n / 10000).toFixed(1) + '万' : '—';

            const metrics = [
                { 
                    label: '月活用户', 
                    value: fmtInt(data.月活), 
                    wow: prevData ? calculateChange(data.月活, prevData.月活) : null,
                    yoy: yoyData ? calculateChange(data.月活, yoyData.月活) : null
                },
                { 
                    label: '新增用户', 
                    value: fmtInt(data.新增用户), 
                    wow: prevData ? calculateChange(data.新增用户, prevData.新增用户) : null,
                    yoy: yoyData ? calculateChange(data.新增用户, yoyData.新增用户) : null
                },
                { 
                    label: '次月留存率', 
                    value: fmtPct(data.次月留存), 
                    wow: prevData ? calculateChangepp(data.次月留存, prevData.次月留存) : null,
                    yoy: yoyData ? calculateChangepp(data.次月留存, yoyData.次月留存) : null
                },
                { 
                    label: '营收', 
                    value: fmtWanFromYuan(data.营收), 
                    wow: prevData ? calculateChange(data.营收, prevData.营收) : null,
                    yoy: yoyData ? calculateChange(data.营收, yoyData.营收) : null
                },
                { 
                    label: 'ARPU', 
                    value: (data.ARPU != null && !isNaN(data.ARPU)) ? data.ARPU.toFixed(2) : '—', 
                    wow: prevData ? calculateChange(data.ARPU, prevData.ARPU) : null,
                    yoy: yoyData ? calculateChange(data.ARPU, yoyData.ARPU) : null
                },
                { 
                    label: '使用率', 
                    value: fmtPct(data.使用率), 
                    wow: prevData ? calculateChangepp(data.使用率, prevData.使用率) : null,
                    yoy: yoyData ? calculateChangepp(data.使用率, yoyData.使用率) : null
                },
                { 
                    label: '大会员活跃率', 
                    value: fmtPct(data.大会员活跃率), 
                    wow: prevData ? calculateChangepp(data.大会员活跃率, prevData.大会员活跃率) : null,
                    yoy: yoyData ? calculateChangepp(data.大会员活跃率, yoyData.大会员活跃率) : null
                }
            ];

            function metricCardHtml(m) {
                return `
                <article class="metric-card">
                    <div class="label">${m.label}</div>
                    <div class="value">${m.value}</div>
                    <div class="changes">
                        ${m.wow ? `<span class="change-item ${getChangeClass(m.wow)}">环比 ${m.wow}</span>` : ''}
                        ${m.yoy ? `<span class="change-item ${getChangeClass(m.yoy)}">同比 ${m.yoy}</span>` : ''}
                    </div>
                </article>`;
            }

            const clusterUser = {
                title: '用户规模',
                aria: '月活、新增与留存',
                cols: '3',
                items: metrics.slice(0, 3),
            };
            const clusterBiz = {
                title: '商业化',
                aria: '营收与 ARPU',
                cols: '2',
                items: metrics.slice(3, 5),
            };
            const clusterEng = {
                title: '活跃与会员',
                aria: '使用率与大会员活跃',
                cols: '2',
                items: metrics.slice(5, 7),
            };

            const grid = document.getElementById('metricsGrid');
            const sectionHtml = (c, extraClass) => `
                <section class="metric-cluster${extraClass ? ' ' + extraClass : ''}" aria-label="${c.title} · ${c.aria}">
                    <h3 class="metric-cluster-title">${c.title}</h3>
                    <div class="metric-cluster-grid metric-cluster-grid--${c.cols}">
                        ${c.items.map(metricCardHtml).join('')}
                    </div>
                </section>`;

            grid.innerHTML =
                sectionHtml(clusterUser, 'metric-cluster--full') +
                `<div class="metric-cluster-row metric-cluster-row--pair">` +
                sectionHtml(clusterBiz, 'metric-cluster--half') +
                sectionHtml(clusterEng, 'metric-cluster--half') +
                `</div>`;
        }

        // 计算变化百分比
        function calculateChange(current, previous) {
            if (current == null || previous == null || isNaN(current) || isNaN(previous) || previous === 0) return null;
            const change = ((current - previous) / previous * 100).toFixed(1);
            return (change >= 0 ? '+' : '') + change + '%';
        }

        // 计算百分点变化（用于百分比指标）
        function calculateChangepp(current, previous) {
            if (current == null || previous == null || isNaN(current) || isNaN(previous)) return null;
            const change = (current - previous).toFixed(1);
            return (change >= 0 ? '+' : '') + change + 'pp';
        }

        // 获取去年同月数据
        function getYoYData(currentData) {
            if (!currentData) return null;
            
            // 解析年份（25年 -> 25）
            const currentYear = parseInt(currentData.年份.replace('年', ''));
            const targetYear = (currentYear - 1) + '年';
            const targetMonth = currentData.月份;
            
            return monthlyData.find(d => 
                d.年份 === targetYear && d.月份 === targetMonth
            );
        }

        // 获取变化样式类（中国风格：红涨绿跌）
        function getChangeClass(change) {
            if (change.includes('+')) return 'positive';  // 红色
            if (change.includes('-')) return 'negative';  // 绿色
            return '';
        }

        /* ───── 复制核心指标到剪贴板（与周度看板同款格式）─────
         * ● 月活25万（环比+34.5%；同比+9.5%），新增用户10万（…），次月留存46%（…）
         * ● 营收97.5万（…），ARPU 3.89（…）
         * ● 深度访问率85%（…），使用率72%（…），大会员活跃71%（…）
         */
        function fmtCopyValue(num, type) {
            if (num == null || !Number.isFinite(num)) return '-';
            if (type === 'percent') {
                return Math.round(num) + '%';
            }
            if (type === 'arpu') {
                return num.toFixed(2);
            }
            if (num >= 10000) {
                const wan = num / 10000;
                return wan.toFixed(1).replace(/\.0$/, '') + '万';
            }
            if (Number.isInteger(num)) return String(num);
            return num.toFixed(2);
        }

        function fmtCopyDelta(current, previous, type) {
            if (previous == null || !Number.isFinite(previous) || !Number.isFinite(current)) return null;
            if (type === 'percent') {
                const diff = current - previous;
                if (Math.abs(diff) < 0.05) return '持平';
                const sign = diff >= 0 ? '+' : '-';
                const text = Math.abs(diff).toFixed(1).replace(/\.0$/, '');
                return `${sign}${text}pp`;
            }
            if (previous === 0) return null;
            const pct = ((current - previous) / previous) * 100;
            if (Math.abs(pct) < 0.05) return '持平';
            const sign = pct >= 0 ? '+' : '-';
            const text = Math.abs(pct).toFixed(1).replace(/\.0$/, '');
            return `${sign}${text}%`;
        }

        function wrapMonthlyCopyMetric(label, value, type, prevVal, yoyVal, spacedValue) {
            const v = fmtCopyValue(value, type);
            const valuePart = spacedValue ? `${label} ${v}` : `${label}${v}`;
            const wow = prevVal != null ? fmtCopyDelta(value, prevVal, type) : null;
            const yoy = yoyVal != null ? fmtCopyDelta(value, yoyVal, type) : null;
            const parts = [];
            if (wow) parts.push(wow === '持平' ? '环比持平' : `环比${wow}`);
            if (yoy) parts.push(yoy === '持平' ? '同比持平' : `同比${yoy}`);
            const tail = parts.length ? `（${parts.join('；')}）` : '';
            return `${valuePart}${tail}`;
        }

        function buildMonthlyCoreMetricsCopyText() {
            if (currentMonth == null || !monthlyData.length) return '';
            const cur = monthlyData[currentMonth];
            if (!cur) return '';
            const prev = currentMonth > 0 ? monthlyData[currentMonth - 1] : null;
            const yoy = getYoYData(cur);

            const line1 = '● ' + [
                wrapMonthlyCopyMetric('月活', cur.月活, 'number', prev?.月活, yoy?.月活, false),
                wrapMonthlyCopyMetric('新增用户', cur.新增用户, 'number', prev?.新增用户, yoy?.新增用户, false),
                wrapMonthlyCopyMetric('次月留存', cur.次月留存, 'percent', prev?.次月留存, yoy?.次月留存, false),
            ].join('，');

            const line2 = '● ' + [
                wrapMonthlyCopyMetric('营收', cur.营收, 'number', prev?.营收, yoy?.营收, false),
                wrapMonthlyCopyMetric('ARPU', cur.ARPU, 'arpu', prev?.ARPU, yoy?.ARPU, true),
            ].join('，');

            const line3 = '● ' + [
                wrapMonthlyCopyMetric('深度访问率', cur.深度访问率, 'percent', prev?.深度访问率, yoy?.深度访问率, false),
                wrapMonthlyCopyMetric('使用率', cur.使用率, 'percent', prev?.使用率, yoy?.使用率, false),
                wrapMonthlyCopyMetric('大会员活跃', cur.大会员活跃率, 'percent', prev?.大会员活跃率, yoy?.大会员活跃率, false),
            ].join('，');

            return [line1, line2, line3].join('\n');
        }

        async function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {
                    console.warn('Clipboard API 不可用，回退 execCommand', e);
                }
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
            document.body.removeChild(ta);
            return ok;
        }

        function setupCopyButton(btnId, buildText) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const textEl = btn.querySelector('.copy-btn-text');
            const original = textEl ? textEl.textContent : '复制';
            let resetTimer = null;

            btn.addEventListener('click', async () => {
                const text = buildText();
                if (!text) {
                    if (textEl) textEl.textContent = '暂无数据';
                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(() => {
                        if (textEl) textEl.textContent = original;
                    }, 1500);
                    return;
                }
                const ok = await copyTextToClipboard(text);
                if (ok) {
                    btn.classList.add('copied');
                    if (textEl) textEl.textContent = '已复制';
                } else if (textEl) {
                    textEl.textContent = '复制失败';
                }
                clearTimeout(resetTimer);
                resetTimer = setTimeout(() => {
                    btn.classList.remove('copied');
                    if (textEl) textEl.textContent = original;
                }, 1500);
            });
        }

        function setupCopyMetricsButton() {
            setupCopyButton('copyMetricsBtn', buildMonthlyCoreMetricsCopyText);
        }

        /** 当前所选月的 B 端行（与 updateB2BMetrics 同源） */
        function getCurrentB2BRow() {
            if (currentMonth == null || !monthlyData.length || !bData.length) return null;
            const currentData = monthlyData[currentMonth];
            if (!currentData) return null;
            return findB2BRow(currentData.年份, currentData.月份);
        }

        /** 复制文案示例：B端：订单1单（ 续签1单），开票金额为1万 */
        function formatB2bWanForCopy(val) {
            const n = parseB2BWanAmount(val);
            if (n == null) return null;
            if (Number.isInteger(n) || Math.abs(n - Math.round(n)) < 1e-6) {
                return String(Math.round(n));
            }
            return String(Number(n.toFixed(2))).replace(/\.?0+$/, '');
        }

        function buildB2bCopyText() {
            const row = getCurrentB2BRow();
            if (!row) return '';

            const orders = safeParseIntCell(row.订单数) ?? 0;
            const xin = safeParseIntCell(row.新签) ?? 0;
            const xu = safeParseIntCell(row.续签) ?? 0;
            const detailParts = [];
            if (xin > 0) detailParts.push(`新签${xin}单`);
            if (xu > 0) detailParts.push(`续签${xu}单`);
            const detail = detailParts.length ? `（ ${detailParts.join(' ')}）` : '';

            const wanStr = formatB2bWanForCopy(row.开票金额);
            const invoicePart = wanStr != null ? `开票金额为${wanStr}万` : '开票金额为-';

            return `B端：订单${orders}单${detail}，${invoicePart}`;
        }

        function setupCopyB2bButton() {
            setupCopyButton('copyB2bBtn', buildB2bCopyText);
        }

        // 获取过滤后的数据
        function getFilteredData() {
            const months = parseInt(document.querySelector('.trend-range-btn.active').dataset.months);
            const endIndex = currentMonth + 1;
            const startIndex = Math.max(0, endIndex - months);
            
            return monthlyData.slice(startIndex, endIndex);
        }

        // 更新B端指标
        function updateB2BMetrics() {
            if (!bData || bData.length === 0) {
                document.getElementById('b2bMetrics').innerHTML = '<p style="text-align:center;color:#999;">暂无B端数据</p>';
                return;
            }
            
            const currentData = monthlyData[currentMonth];
            const currentB2B = bData.find(d => 
                d.年份 === currentData.年份 && d.月份 === currentData.月份
            );
            
            if (!currentB2B) {
                document.getElementById('b2bMetrics').innerHTML = '<p style="text-align:center;color:#999;">当前月份暂无B端数据</p>';
                return;
            }

            const prevB2B = getB2BPrevMonthRow(currentData.年份, currentData.月份);
            const yoyB2B = getB2BYoYRow(currentData.年份, currentData.月份);

            const b2bMetricDefs = [
                { label: '签约金额', display: currentB2B.签约金额, curNum: () => parseB2BWanAmount(currentB2B.签约金额), prevNum: () => prevB2B ? parseB2BWanAmount(prevB2B.签约金额) : null, yoyNum: () => yoyB2B ? parseB2BWanAmount(yoyB2B.签约金额) : null },
                { label: '开票金额', display: currentB2B.开票金额, curNum: () => parseB2BWanAmount(currentB2B.开票金额), prevNum: () => prevB2B ? parseB2BWanAmount(prevB2B.开票金额) : null, yoyNum: () => yoyB2B ? parseB2BWanAmount(yoyB2B.开票金额) : null },
                { label: '到款金额', display: currentB2B.到款金额, curNum: () => parseB2BWanAmount(currentB2B.到款金额), prevNum: () => prevB2B ? parseB2BWanAmount(prevB2B.到款金额) : null, yoyNum: () => yoyB2B ? parseB2BWanAmount(yoyB2B.到款金额) : null },

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // 移除输入指示器
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
    </script>
</body>
</html>
