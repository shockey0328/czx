  <script src="./embedded-csv-b64.js"></script>
  <script>
    // ---------------------------
    // 1) CSV 数据加载（替代 Mock）
    // ---------------------------
    // 优先 fetch 同目录 CSV；在 file:// 打开时 fetch 会失败，则自动使用 embedded-csv-b64.js 中的内嵌副本。
    const CSV_FILES = {
      core: "./周度用户核心数据.csv",
      daily: "./每天的活跃用户及新老用户.csv",
      /** 渠道：默认文件名；若存在 _fixed 备选会在 fetch 时自动尝试 */
      activeCh: "./每周活跃用户的渠道来源.csv",
      activeChAlt: "./每周活跃用户的渠道来源_fixed.csv",
      newCh: "./每周新用户的渠道来源.csv",
    };

    /** 看板主数据年份（CSV 中按「周开始日期」解析年份，仅取该年作为核心序列） */
    const CURRENT_YEAR = 2026;

    // 渠道周区间与核心周区间存在固定偏移（观察到 channel 的 week_start/week_end 比核心晚 4 天）
    const CHANNEL_SHIFT_DAYS = 4;

    const mock = {
      // W1 ~ Wn（来自“周度用户核心数据.csv”里的 第n周）
      weeks: [],
      activeUsers: [],
      newUsers: [],
      cumulativeUsers: [],

      // 模块三：渠道展示（当周全部渠道来源，按当期占比排序）
      activeChannels: [],
      newChannels: [],
      // 环比份额：prev(上周) vs end(本周)
      activeChannelShareW11: [],
      activeChannelShareW12: [],
      newChannelShareW11: [],
      newChannelShareW12: [],
    };

    let cumulativeUsers = [];
    let newShare = [];
    let newGrowthRate = [];
    let activeGrowthRate = [];

    let coreWeeks = [];            // {weekNo, startISO, endISO}
    let dailyRows = [];           // {dtISO, active_uv, new_uv, old_uv, sharePct}
    let activeChannelRows = [];  // {week_startISO, week_endISO, channel_name, uv}
    let newChannelRows = [];

    /** 当前选中的周在 coreWeeks（当年序列）中的下标 */
    let selectedWeekIdx = 0;
    /** 趋势图周期按钮当前值 */
    let currentTrendRange = "week";

    function stripBom(s) {
      return s && s.charCodeAt(0) === 0xFEFF ? s.slice(1) : s;
    }

    // 简易 CSV 解析（支持双引号字段）
    function parseCSV(text) {
      const s = stripBom(String(text || ""));
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < s.length; i++) {
        const ch = s[i];

        if (ch === '"') {
          if (inQuotes && s[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (ch === "," && !inQuotes) {
          row.push(field);
          field = "";
          continue;
        }

        if (ch === "\n" && !inQuotes) {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
          continue;
        }

        if (ch === "\r" && !inQuotes) {
          continue;
        }

        field += ch;
      }

      // 最后一行
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }

      // 清理空行
      return rows.filter(r => r.some(c => String(c).trim() !== ""));
    }

    function toNumber(v) {
      const raw = String(v ?? "").trim();
      if (!raw) return 0;
      return Number(raw.replace(/,/g, "").replace(/%/g, ""));
    }

    function parseSlashDate(s) {
      // 2026/1/1 或 2026/01/01
      const [y, m, d] = String(s).trim().split("/");
      return new Date(Number(y), Number(m) - 1, Number(d));
    }

    function parseISODate(s) {
      // 2026-01-05
      const [y, m, d] = String(s).trim().split("-");
      return new Date(Number(y), Number(m) - 1, Number(d));
    }

    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function addDays(dateObj, days) {
      const d = new Date(dateObj);
      d.setDate(d.getDate() + days);
      return d;
    }

    /** 渠道表 week_start/week_end 可能是 2026-01-05 或 2026/1/5，统一为 ISO 便于与核心周对齐 */
    function normalizeChannelDateCell(v) {
      let s = String(v ?? "").trim().replace(/^\uFEFF/, "");
      if (s.startsWith('"') && s.endsWith('"')) s = s.slice(1, -1).trim();
      if (!s) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (s.includes("/")) return toISODate(parseSlashDate(s));
      return s;
    }

    function utf8FromBase64(b64) {
      const binary = atob(b64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    /** 排除 SPA/404 页返回的 HTML（仍可能 res.ok） */
    function looksLikeCsvText(text) {
      const t = String(text || "").trim();
      if (!t) return false;
      const head = t.slice(0, 80).toLowerCase();
      if (head.startsWith("<!doctype") || head.startsWith("<html") || head.startsWith("<head")) return false;
      return true;
    }

    /**
     * 先 fetch 同目录 CSV（URL 相对当前页解析）；失败或内容非 CSV 时用 embedded-csv-b64.js（线上未部署 CSV 时仍可展示）。
     */
    async function loadCsvText(key, url, alternateUrls = []) {
      const urls = [url, ...alternateUrls].filter(Boolean).map((u) => {
        try {
          return new URL(u, window.location.href).href;
        } catch (e) {
          return u;
        }
      });
      for (const u of urls) {
        try {
          const res = await fetch(u, { cache: "no-store" });
          if (res.ok) {
            const text = await res.text();
            if (looksLikeCsvText(text)) return text;
          }
        } catch (e) {
          /* file://、跨域、网络错误等 */
        }
      }
      if (typeof EMBEDDED_CSV_B64 !== "undefined" && EMBEDDED_CSV_B64[key]) {
        return utf8FromBase64(EMBEDDED_CSV_B64[key]);
      }
      throw new Error(`无法加载 CSV：${key}（fetch 失败且无内嵌数据，请确认 embedded-csv-b64.js 与 HTML 同目录）`);
    }

    function parseActiveChannelTable(activeChText) {
      const activeChTable = parseCSV(activeChText);
      const activeChHeader = activeChTable[0];
      const aIdx = {
        wkStart: activeChHeader.indexOf("week_start"),
        wkEnd: activeChHeader.indexOf("week_end"),
        name: activeChHeader.indexOf("channel_name"),
        uv: activeChHeader.indexOf("uv"),
      };
      if (aIdx.wkStart < 0 || aIdx.wkEnd < 0 || aIdx.name < 0 || aIdx.uv < 0) {
        console.warn("活跃用户渠道 CSV 表头缺少 week_start / week_end / channel_name / uv");
      }
      return activeChTable.slice(1).map(r => ({
        week_startISO: normalizeChannelDateCell(r[aIdx.wkStart]),
        week_endISO: normalizeChannelDateCell(r[aIdx.wkEnd]),
        channel_name: String(r[aIdx.name] ?? "").trim().replace(/^"|"$/g, ""),
        uv: toNumber(r[aIdx.uv]),
      }));
    }

    function parseNewChannelTable(newChText) {
      const newChTable = parseCSV(newChText);
      const newChHeader = newChTable[0];
      const newUvCol = newChHeader.indexOf("new_user_uv") >= 0 ? newChHeader.indexOf("new_user_uv") : newChHeader.indexOf("uv");
      const nIdx = {
        wkStart: newChHeader.indexOf("week_start"),
        wkEnd: newChHeader.indexOf("week_end"),
        name: newChHeader.indexOf("channel_name"),
        uv: newUvCol,
      };
      if (nIdx.wkStart < 0 || nIdx.wkEnd < 0 || nIdx.name < 0 || nIdx.uv < 0) {
        console.warn("新用户渠道 CSV 表头缺少 week_start / week_end / channel_name / new_user_uv 或 uv");
      }
      return newChTable.slice(1).map(r => ({
        week_startISO: normalizeChannelDateCell(r[nIdx.wkStart]),
        week_endISO: normalizeChannelDateCell(r[nIdx.wkEnd]),
        channel_name: String(r[nIdx.name] ?? "").trim().replace(/^"|"$/g, ""),
        uv: toNumber(r[nIdx.uv]),
      }));
    }

    function buildChannelTopShares(channelRows, endShiftStartISO, endShiftEndISO, prevShiftStartISO, prevShiftEndISO) {
      const endRows = channelRows.filter(r => r.week_startISO === endShiftStartISO && r.week_endISO === endShiftEndISO);
      const prevRows = channelRows.filter(r => r.week_startISO === prevShiftStartISO && r.week_endISO === prevShiftEndISO);

      const endMap = new Map();
      const prevMap = new Map();

      let endTotal = 0;
      let prevTotal = 0;

      for (const r of endRows) {
        const uv = Number(r.uv) || 0;
        endTotal += uv;
        endMap.set(r.channel_name, (endMap.get(r.channel_name) || 0) + uv);
      }
      for (const r of prevRows) {
        const uv = Number(r.uv) || 0;
        prevTotal += uv;
        prevMap.set(r.channel_name, (prevMap.get(r.channel_name) || 0) + uv);
      }

      /** 合并当期与上期出现过的全部渠道名称，按当期 UV 降序（仅在上期出现的排后） */
      const allNames = new Set([...endMap.keys(), ...prevMap.keys()]);
      const entries = [...allNames].map(name => ({
        name,
        uv: endMap.get(name) || 0,
      }));
      entries.sort((a, b) => b.uv - a.uv);

      const endDen = endTotal || 1;
      const prevDen = prevTotal || 1;

      const channelNames = entries.map(x => x.name);
      const sharesEnd = entries.map(x => (x.uv / endDen) * 100);
      const sharesPrev = entries.map(x => ((prevMap.get(x.name) || 0) / prevDen) * 100);

      return { channelNames, sharesPrev, sharesEnd };
    }

    function computeDerived() {
      cumulativeUsers = (mock.cumulativeUsers || []).slice();
      newShare = mock.newUsers.map((n, i) => (mock.activeUsers[i] ? (n / mock.activeUsers[i]) * 100 : 0));
      newGrowthRate = mock.newUsers.map((n, i) => {
        if (i === 0) return 0;
        const prev = mock.newUsers[i - 1];
        return prev === 0 ? 0 : ((n - prev) / prev) * 100;
      });
      activeGrowthRate = mock.activeUsers.map((v, i) => {
        if (i === 0) return 0;
        const prev = mock.activeUsers[i - 1];
        return prev === 0 ? 0 : ((v - prev) / prev) * 100;
      });
    }

    function computeLatestChannelModel() {
      const endIdx = selectedWeekIdx;
      if (endIdx <= 0) return;
      const prevIdx = endIdx - 1;

      const end = coreWeeks[endIdx];
      const prev = coreWeeks[prevIdx];
      const endShiftStartISO = toISODate(addDays(parseISODate(end.startISO), CHANNEL_SHIFT_DAYS));
      const endShiftEndISO = toISODate(addDays(parseISODate(end.endISO), CHANNEL_SHIFT_DAYS));
      const prevShiftStartISO = toISODate(addDays(parseISODate(prev.startISO), CHANNEL_SHIFT_DAYS));
      const prevShiftEndISO = toISODate(addDays(parseISODate(prev.endISO), CHANNEL_SHIFT_DAYS));

      const activeModel = buildChannelTopShares(activeChannelRows, endShiftStartISO, endShiftEndISO, prevShiftStartISO, prevShiftEndISO);
      const newModel = buildChannelTopShares(newChannelRows, endShiftStartISO, endShiftEndISO, prevShiftStartISO, prevShiftEndISO);

      mock.activeChannels = activeModel.channelNames;
      mock.newChannels = newModel.channelNames;
      mock.activeChannelShareW11 = activeModel.sharesPrev;
      mock.activeChannelShareW12 = activeModel.sharesEnd;
      mock.newChannelShareW11 = newModel.sharesPrev;
      mock.newChannelShareW12 = newModel.sharesEnd;
    }

      };

    async function loadAllData() {
      const [coreText, dailyText, activeChText, newChText] = await Promise.all([
        loadCsvText("core", CSV_FILES.core),
        loadCsvText("daily", CSV_FILES.daily),
        loadCsvText("activeCh", CSV_FILES.activeCh, [CSV_FILES.activeChAlt]),
        loadCsvText("newCh", CSV_FILES.newCh),
      ]);

      // 核心周度
      const coreTable = parseCSV(coreText);
      const coreHeader = coreTable[0];
      const coreIdx = {
        weekNo: coreHeader.indexOf("第n周"),
        start: coreHeader.indexOf("周开始日期"),
        end: coreHeader.indexOf("周结束日期"),
        active: coreHeader.indexOf("活跃用户"),
        news: coreHeader.indexOf("新增用户"),
        share: coreHeader.indexOf("新增用户占比"),
        cum: coreHeader.indexOf("累计用户"),
      };

      const coreRowsParsed = coreTable.slice(1).map(r => {
        const weekNo = Number(r[coreIdx.weekNo]);
        const startSlash = r[coreIdx.start];
        const endSlash = r[coreIdx.end];
        const startISO = toISODate(parseSlashDate(startSlash));
        const endISO = toISODate(parseSlashDate(endSlash));
        const year = parseInt(String(startISO).slice(0, 4), 10);
        return {
          weekNo,
          year,
          startISO,
          endISO,
          active: toNumber(r[coreIdx.active]),
          newUsers: toNumber(r[coreIdx.news]),
          sharePct: toNumber(r[coreIdx.share]),
          cum: toNumber(r[coreIdx.cum]),
        };
      }).filter(x => x.weekNo && x.startISO);

      const coreCurrentYear = coreRowsParsed
        .filter(r => r.year === CURRENT_YEAR)
        .sort((a, b) => a.weekNo - b.weekNo);

      coreWeeks = coreCurrentYear.map(({ weekNo, startISO, endISO }) => ({ weekNo, startISO, endISO }));
      mock.weeks = coreCurrentYear.map(w => `W${w.weekNo}`);
      mock.activeUsers = coreCurrentYear.map(r => r.active);
      mock.newUsers = coreCurrentYear.map(r => r.newUsers);
      mock.cumulativeUsers = coreCurrentYear.map(r => r.cum);

      selectedWeekIdx = Math.max(0, coreWeeks.length - 1);

      updatePeriodBadge();

      // 日度：主要用于“趋势分析”的新用户增长计算口径（new_uv 可直接累加）
      const dailyTable = parseCSV(dailyText);
      const dailyHeader = dailyTable[0];
      const dailyIdx = {
        dt: dailyHeader.indexOf("dt"),
        active: dailyHeader.indexOf("active_uv"),
        news: dailyHeader.indexOf("new_uv"),
        old: dailyHeader.indexOf("old_uv"),
        share: dailyHeader.indexOf("新用户占比"),
      };

      dailyRows = dailyTable.slice(1).map(r => {
        const dtISO = toISODate(parseSlashDate(r[dailyIdx.dt]));
        return {
          dtISO,
          active_uv: toNumber(r[dailyIdx.active]),
          new_uv: toNumber(r[dailyIdx.news]),
          old_uv: toNumber(r[dailyIdx.old]),
          sharePct: toNumber(r[dailyIdx.share]),
        };
      });
      dailyRows.sort((a, b) => parseISODate(a.dtISO) - parseISODate(b.dtISO));

      // 计算每周新增用户（new_uv 为新用户，不会跨天重复计入），用于替代 mock.newUsers（保证与日度口径一致）
      const weeklyNewFromDaily = [];
      for (const wk of coreWeeks) {
        const startDate = parseISODate(wk.startISO);
        const endDate = parseISODate(wk.endISO);
        let sumNew = 0;
        for (const d of dailyRows) {
          const dt = parseISODate(d.dtISO);
          if (dt >= startDate && dt <= endDate) sumNew += d.new_uv;
        }
        weeklyNewFromDaily.push(sumNew);
      }
      // 若日度累计与核心周表一致，则以日度口径覆盖（否则保留核心周表，避免异常带偏）
      const mismatch = weeklyNewFromDaily.some((x, i) => x !== mock.newUsers[i]);
      if (!mismatch) {
        mock.newUsers = weeklyNewFromDaily;
      }

      activeChannelRows = parseActiveChannelTable(activeChText);
      newChannelRows = parseNewChannelTable(newChText);

      computeDerived();
      computeLatestChannelModel();
    }

    // ---------------------------
    // 2) 工具函数
    // ---------------------------
    const nfInt = new Intl.NumberFormat('zh-CN');
    const nf1 = (x) => (Math.round(x * 10) / 10).toFixed(1);

    function formatInt(n) {
      return nfInt.format(Math.round(n));
    }

    function formatPercent1(n, forceSign = true) {
      const v = Math.round(n * 10) / 10;
      const sign = (forceSign && v > 0) ? "+" : "";
      return `${sign}${v.toFixed(1)}%`;
    }

    /** 占比类指标的环比：用百分点 pp（本期% − 上期%） */
    function formatPP(deltaPP, forceSign = true) {
      const v = Math.round(deltaPP * 10) / 10;
      const sign = (forceSign && v > 0) ? "+" : "";
      return `${sign}${v.toFixed(1)}pp`;
    }

    function deltaPct(curr, prev) {
      if (!isFinite(prev) || prev === 0) return 0;
      return ((curr - prev) / prev) * 100;
    }

    /**
     * @param {"rate"|"pp"} variant rate=相对变化率(%)，pp=占比差(百分点)
     */
    function deltaBadge(delta, label = "环比", variant = "rate") {
      if (!isFinite(delta)) {
        return `
        <div class="text-right">
          <div class="text-[11px] font-medium text-stone-400">${label}</div>
          <div class="mt-1 text-sm font-semibold tabular-nums text-stone-400">—</div>
        </div>
      `;
      }
      const up = delta >= 0;
      const colorCls = up ? "text-up" : "text-down";
      const text = variant === "pp" ? formatPP(delta) : formatPercent1(delta);
      return `
        <div class="text-right">
          <div class="text-[11px] font-medium text-stone-400">${label}</div>
          <div class="mt-1 ${colorCls} font-bold text-sm tabular-nums">${text}</div>
        </div>
      `;
    }

    /**
     * 趋势分析：按「日」切片（与上方周期按钮一致：本周=当前自然周内的每一天；近4周/12周=对应周跨度内的所有日）
     */
    function getDailyTrendSlice(rangeKey) {
      if (!dailyRows.length || !coreWeeks.length) {
        return { labels: [], active: [], newUsers: [], growth: [], share: [] };
      }
      const byDate = new Map(dailyRows.map(d => [d.dtISO, d]));
      const endIdx = Math.min(Math.max(0, selectedWeekIdx), coreWeeks.length - 1);
      let startISO;
      const endISO = coreWeeks[endIdx].endISO;
      if (rangeKey === "week") {
        startISO = coreWeeks[endIdx].startISO;
      } else if (rangeKey === "4w") {
        const s = Math.max(0, endIdx - 3);
        startISO = coreWeeks[s].startISO;
      } else {
        const s = Math.max(0, endIdx - 11);
        startISO = coreWeeks[s].startISO;
      }
      const startD = parseISODate(startISO);
      const endD = parseISODate(endISO);
      const inRange = dailyRows.filter(d => {
        const dt = parseISODate(d.dtISO);
        return dt >= startD && dt <= endD;
      });
      const labels = inRange.map(d => {
        const parts = d.dtISO.split("-");
        const m = parts[1];
        const day = parts[2];
        return `${Number(m)}/${Number(day)}`;
      });
      const active = inRange.map(d => d.active_uv);
      const newUsers = inRange.map(d => d.new_uv);
      const share = inRange.map(d => d.sharePct);
      const growth = inRange.map(d => {
        const prevISO = toISODate(addDays(parseISODate(d.dtISO), -1));
        const prevRow = byDate.get(prevISO);
        if (!prevRow) return 0;
        const pv = prevRow.new_uv;
        if (pv === 0) return 0;
        return ((d.new_uv - pv) / pv) * 100;
      });
      return { labels, active, newUsers, growth, share };
    }

    /** 横轴点较多时旋转标签，避免重叠 */
    function getCategoryAxisExtra(len) {
      if (!len) return { bottom: 44, rotate: 0, interval: 0 };
      if (len <= 12) return { bottom: 44, rotate: 0, interval: 0 };
      if (len <= 42) return { bottom: 56, rotate: 28, interval: 0 };
      return { bottom: 64, rotate: 35, interval: Math.max(1, Math.floor(len / 18)) };
    }

    // ---------------------------
    // 3) 模块一：核心指标（默认展示 W12 “本周”）
    // ---------------------------
    function renderKpis() {
      const endIdx = selectedWeekIdx;
      if (endIdx < 0 || !mock.activeUsers.length) return;

      const newU = mock.newUsers[endIdx];
      const activeU = mock.activeUsers[endIdx];
      const shareU = newShare[endIdx];
      const cumU = cumulativeUsers[endIdx];

      const prevIdx = endIdx - 1;
      const hasPrev = prevIdx >= 0;

      const newDelta = hasPrev ? deltaPct(newU, mock.newUsers[prevIdx]) : NaN;
      const activeDelta = hasPrev ? deltaPct(activeU, mock.activeUsers[prevIdx]) : NaN;
      const shareDeltaPP = hasPrev ? (shareU - newShare[prevIdx]) : NaN;
      const cumDelta = hasPrev ? deltaPct(cumU, cumulativeUsers[prevIdx]) : NaN;

      document.getElementById("kpiNewUsersValue").textContent = formatInt(newU);
      document.getElementById("kpiNewUsersDelta").innerHTML = deltaBadge(newDelta, "环比");

      document.getElementById("kpiActiveUsersValue").textContent = formatInt(activeU);
      document.getElementById("kpiActiveUsersDelta").innerHTML = deltaBadge(activeDelta, "环比");

      document.getElementById("kpiNewShareValue").textContent = `${nf1(shareU)}%`;
      document.getElementById("kpiNewShareDelta").innerHTML = deltaBadge(shareDeltaPP, "环比", "pp");

      document.getElementById("kpiCumulativeValue").textContent = formatInt(cumU);
      document.getElementById("kpiCumulativeDelta").innerHTML = deltaBadge(cumDelta, "环比");
    }

    function computeChannelCounts(total, shares) {
      return shares.map(s => total * (s / 100));
    }

    function buildTableRowHTML({ name, count, sharePct, deltaPctValue }) {
      const up = deltaPctValue >= 0;

        </tr>

      const activeRows = activeNames.map((name, i) => ({

      // 饼图使用统一橙色渐变（通过每一块的线性渐变色模拟）
      function pieColorStops(i) {
        const palette = [
          ["#9A3412", "#FF6B35"],
          ["#FF6B35", "#FB923C"],
          ["#C2410C", "#F97316"],
          ["#F97316", "#FDBA74"],
          ["#FF6B35", "#FDBA74"],
          ["#7C2D12", "#FB923C"],
        ];
        const p = palette[i % palette.length];
        return {
          type: "linear",
          x: 0, y: 0, x2: 1, y2: 1,
          colorStops: [
            { offset: 0, color: p[0] },
            { offset: 1, color: p[1] }
          ]
        };
      }

      function buildPieData(rows) {
        return rows.map((r, i) => ({
          name: r.name,
          value: r.count,
          itemStyle: { color: pieColorStops(i) },
        }));
      }

      const pieActiveData = buildPieData(activeRows);
      const pieNewData = buildPieData(newRows);

        return {
          backgroundColor: "transparent",
          tooltip: {
            trigger: "item",
            backgroundColor: "rgba(17,24,39,0.92)",
            borderWidth: 0,
            textStyle: { color: "#fff" },

              type: "pie",

      const pieActiveEl = document.getElementById("pieActive");
      const pieNewEl = document.getElementById("pieNew");

      if (typeof echarts === "undefined") {

      if (!pieActiveChart) pieActiveChart = echarts.init(pieActiveEl);

      pieActiveChart.setOption(makePieOption("活跃渠道", pieActiveData, activeTotal), true);
      pieNewChart.setOption(makePieOption("新增渠道", pieNewData, newTotal), true);

      function bindPieClickHighlight(pieChart, tableBodyElId) {
        const tableBodyEl = document.getElementById(tableBodyElId);
        pieChart.off("click");

        pieChart.on("click", (params) => {
          if (!params || params.dataIndex == null) return;
          const dataIndex = params.dataIndex;

          const seriesIndex = 0;
          const totalDataLen = pieChart.getOption()?.series?.[0]?.data?.length ?? 0;
          for (let i = 0; i < totalDataLen; i++) {
            if (i === dataIndex) pieChart.dispatchAction({ type: "highlight", seriesIndex, dataIndex: i });
            else pieChart.dispatchAction({ type: "downplay", seriesIndex, dataIndex: i });
          }

          // 表格高亮对应行
          const name = params.name;
          tableBodyEl.querySelectorAll("tr[data-channel]").forEach(tr => {
            tr.classList.remove("bg-orange-50/90");
          });
          const row = tableBodyEl.querySelector(`tr[data-channel="${CSS.escape(name)}"]`);
          if (row) row.classList.add("bg-orange-50/90");
        });
      }

      bindPieClickHighlight(pieActiveChart, "tableActiveBody");
      bindPieClickHighlight(pieNewChart, "tableNewBody");
    }

    // ---------------------------
    // 6) 模块四：自动生成周度分析报告（与 Mock 数据一致）
    // ---------------------------
    function getTrendStage() {
      const endIdx = selectedWeekIdx;
      // 取“前4周”和“后4周”计算阶段（环比增长率用于更贴近增长节奏）
      const firstStart = 1; // activeGrowthRate[0]=0，跳过
      const firstEnd = firstStart + 3; // 前4个有效点
      const lastStart = Math.max(1, endIdx - 3);
      const lastEnd = endIdx;

      const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
      const a1 = avg(activeGrowthRate.slice(firstStart, firstEnd + 1));
      const a2 = lastStart <= lastEnd
        ? avg(activeGrowthRate.slice(lastStart, lastEnd + 1))
        : avg(activeGrowthRate.slice(0, Math.max(0, endIdx + 1)));

      let minVal = Infinity;
      let minIdx = 1;
      for (let i = 1; i < activeGrowthRate.length; i++) {
        if (activeGrowthRate[i] < minVal) {
          minVal = activeGrowthRate[i];
          minIdx = i;
        }
      }
      const pivotWeek = mock.weeks[minIdx];

      if (a2 > a1 * 1.05) return { stage: "加速增长", pivotWeek };
      if (a2 < a1 * 0.85) return { stage: "增长放缓", pivotWeek };
      return { stage: "稳定增长", pivotWeek };
    }

    function getTopChannels() {
      const endIdx = selectedWeekIdx;
      const prevIdx = Math.max(0, endIdx - 1);

      const activeTotal = mock.activeUsers[endIdx];
      const activeTotalPrev = mock.activeUsers[prevIdx];
      const newTotal = mock.newUsers[endIdx];
      const newTotalPrev = mock.newUsers[prevIdx];

      const activeCounts = computeChannelCounts(activeTotal, mock.activeChannelShareW12);
      const activeCountsPrev = computeChannelCounts(activeTotalPrev, mock.activeChannelShareW11);
      const newCounts = computeChannelCounts(newTotal, mock.newChannelShareW12);
      const newCountsPrev = computeChannelCounts(newTotalPrev, mock.newChannelShareW11);

      const activeRows = mock.activeChannels.map((name, i) => ({
        name,
        count: activeCounts[i],
        delta: deltaPct(activeCounts[i], activeCountsPrev[i]),
        sharePct: mock.activeChannelShareW12[i],
      })).sort((a, b) => b.count - a.count);

      const newRows = mock.newChannels.map((name, i) => ({
        name,
        count: newCounts[i],
        delta: deltaPct(newCounts[i], newCountsPrev[i]),
        sharePct: mock.newChannelShareW12[i],
      })).sort((a, b) => b.count - a.count);

      const activeTop1 = activeRows[0];
      const newTop1 = newRows[0];

      const activeFastest = [...activeRows].sort((a, b) => b.delta - a.delta)[0];
      const newFastest = [...newRows].sort((a, b) => b.delta - a.delta)[0];

      const activeDecliners = activeRows.filter(r => r.delta < 0).sort((a, b) => a.delta - b.delta);
      const newDecliners = newRows.filter(r => r.delta < 0).sort((a, b) => a.delta - b.delta);

      // 新用户前两大渠道占比
      const top2NewShare = mock.newChannelShareW12
        .slice()
        .sort((a, b) => b - a)[0] +
        mock.newChannelShareW12.slice().sort((a, b) => b - a)[1];

      return {
        activeTop1,
        newTop1,
        activeFastest,
        newFastest,
        activeDecliners,
        newDecliners,
        top2NewShare,
      };
    }

    function getRiskSignals() {
      const endIdx = selectedWeekIdx;
      const prevIdx = Math.max(0, endIdx - 1);

      const shareNow = newShare[endIdx];
      const w8Idx = Math.min(7, endIdx); // 如果不足 8 周，则退化为第 1 周
      const shareW8 = newShare[w8Idx] ?? 0;

      // 新用户占比在 W8->本周 是否回落（用于风险提示）
      const lastShares = newShare.slice(w8Idx, endIdx + 1).filter(v => isFinite(v));
      const sharePeak = lastShares.length ? Math.max(...lastShares) : shareW8;
      const shareDownOverall = shareNow < sharePeak;

      // 新增渠道最大下滑（新增侧）
      const newCounts = computeChannelCounts(mock.newUsers[endIdx], mock.newChannelShareW12);
      const newCountsPrev = computeChannelCounts(mock.newUsers[prevIdx], mock.newChannelShareW11);
      const newDecliner = mock.newChannels
        .map((name, i) => ({ name, delta: deltaPct(newCounts[i], newCountsPrev[i]) }))
        .sort((a, b) => a.delta - b.delta)[0];

      const health = 30;
      const belowHealthCount = lastShares.filter(s => s < health).length;

      return {
        shareNow,
        shareW8,
        shareDownOverall,
        belowHealthCount,
        lastSharesCount: lastShares.length || 1,
        newWorstDecliner: newDecliner,
      };
    }

      {
        q: "哪个渠道的 ROI 最高？",
        a: "从本周数据看，ROI 更高的渠道是「邀请注册」。该渠道在新增侧环比增速更突出，同时占比具备持续贡献空间。建议把邀请码分发、首登礼包与引导文案打磨到“首次访问-首次转化”的最短路径上，放大高效获客带来的新增增量。"
      },
      {
        q: "新用户占比下降该怎么办？",
        a: "新用户占比从 W8 的高位回落到本周（约 29.x% → 27.x%），说明“新增规模改善”未能同步转化为更高的结构占比。建议：1）优先提升新增链路的首周留存与首次访问转化；2）对贡献大的渠道（应用商店、社交媒体）做落地页匹配与人群定向；3）对下滑渠道（如付费类）排查投放效率与转化链路掉点，避免结构继续被拉低。"
      },
      {
        q: "下周增长预测是什么？",
        a: "基于最近 12 周活跃与新增节奏：活跃整体回稳、但增长更偏温和；新增在 W11 出现小波动后回到正向。下周预计呈现“新增小幅上行、活跃稳定增长、结构压力仍需跟踪”的格局。若邀请注册保持高增速且付费侧下滑得到纠偏，新用户占比大概率在 27.x%~28.x% 区间波动。"
      },
      {
        q: "新用户下降的原因是什么？",
        a: "主要信号来自新用户占比的结构性走低：新增虽在增长，但活跃基数上升更快导致占比被稀释；同时部分渠道（尤其付费类）存在环比下滑，拖慢了结构修复速度。建议按渠道拆分拉新-转化-留存三段链路定位问题环节。"
      }
    ];

    function getMockReply(question) {
      const q = String(question || "").trim();
      const direct = mockQA.find(x => x.q === q);
      if (direct) return direct.a;

      if (/占比.*下降|下降.*占比/.test(q)) {
        return mockQA.find(t => t.q === "新用户占比下降该怎么办？")?.a
          || "新用户占比下降通常需要从渠道效率与转化链路入手逐段排查。";
      }
      if (/ROI/.test(q)) {
        return mockQA.find(t => t.q === "哪个渠道的 ROI 最高？")?.a
          || "ROI 更高的渠道通常与“增长最快且仍保持稳定占比”的渠道相关。";
      }
      if (/预测|下周/.test(q)) {
        return mockQA.find(t => t.q === "下周增长预测是什么？")?.a
          || "下周增长预计以稳定为主，但需关注结构性指标与下滑渠道的修复情况。";
      }
      return "我可以基于当前看板数据帮你进一步拆解原因。建议你补充你关注的维度（渠道、转化、留存或投放人群），例如：要我看「付费推广」还是「应用商店」的环比变化？";
    }

    function sendChat(text) {
      const q = String(text || "").trim();
      if (!q) return;
      appendUserBubble(q);
      setTimeout(() => {
        const reply = getMockReply(q);
        appendAiBubble(reply);
      }, 380);
    }

    document.getElementById("sendBtn").addEventListener("click", () => {
      sendChat(chatInput.value);
      chatInput.value = "";
      chatInput.focus();
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("sendBtn").click();
      }
    });

    document.querySelectorAll(".quick-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const q = btn.getAttribute("data-q");
        chatInput.value = q;
        sendChat(q);
        chatInput.value = "";
        chatInput.focus();
      });
    });

    // ---------------------------
    // 8) 初始化 + 监听 resize + 时间切换联动
    // ---------------------------
    const RANGE_BTN_ACTIVE =
      "range-btn flex-1 rounded-xl px-2 py-2.5 text-sm font-semibold bg-brand text-white shadow-sm transition-colors duration-150 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-brand/40 sm:min-w-[4.5rem] sm:flex-none sm:px-3";
    const RANGE_BTN_IDLE =
      "range-btn flex-1 rounded-xl px-2 py-2.5 text-sm font-medium text-stone-600 transition-colors duration-150 hover:bg-white/90 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-200 sm:min-w-[4.5rem] sm:flex-none sm:px-3";

    function setActiveRangeButton(rangeKey) {
      document.querySelectorAll(".range-btn").forEach(b => {
        const isActive = b.getAttribute("data-range") === rangeKey;
        b.className = isActive ? RANGE_BTN_ACTIVE : RANGE_BTN_IDLE;
      });
    }

    function bindRangeButtons() {
      document.querySelectorAll(".range-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const rangeKey = btn.getAttribute("data-range");
          setActiveRangeButton(rangeKey);
          updateCharts(rangeKey); // 需求：图表联动变化（Mock）
        });
      });
    }

    function debounce(fn, delayMs) {
      let t = null;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delayMs);
      };
    }

    function resizeCharts() {
      chartActive && chartActive.resize();
      chartNewMix && chartNewMix.resize();
      chartNewShare && chartNewShare.resize();
      pieActiveChart && pieActiveChart.resize();
      pieNewChart && pieNewChart.resize();
    }

    window.addEventListener("load", async () => {
      (function initBrandLogo() {
        const img = document.getElementById("brandLogo");
        const fb = document.getElementById("logoFallback");
        if (!img || !fb) return;
        img.addEventListener("error", () => {
          img.classList.add("hidden");
          fb.classList.remove("hidden");
        });
      })();
      try {
        await loadAllData();

        initWeekSelector();
        updateWeekMetaLabel();
        updatePeriodBadge();

        renderKpis();
        initCharts();
        renderChannelTablesAndPies();
        renderReport();
        bindRangeButtons();

        const hint = document.getElementById("dataModeHint");
        if (hint) hint.textContent = "";

        window.addEventListener("resize", debounce(resizeCharts, 180));
      } catch (err) {
        console.error(err);
        const hint = document.getElementById("dataModeHint");
        if (hint) hint.textContent = "";
      }
    });
  </script>
</body>
</html>
