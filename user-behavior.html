<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户行为看板 · 内网入口</title>
  <link rel="stylesheet" href="weekly-dashboard-theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans, "PingFang SC", "Microsoft YaHei", sans-serif);
      background: var(--color-bg, #fff8f4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #333;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      border: 1px solid rgba(255, 163, 102, 0.2);
      box-shadow: 0 8px 28px rgba(255, 107, 53, 0.12);
    }
    h1 { font-size: 22px; color: #FF6B35; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.7; color: #555; margin-bottom: 12px; }
    .tip {
      background: #fff9f7;
      border: 1px solid #ffd8c4;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #666;
      margin: 16px 0;
    }
    .tip code {
      background: #f5f5f5;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #FF6B35 0%, #FFA366 100%);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
    }
    .btn:hover { filter: brightness(1.03); }
    .btn.secondary {
      background: #fff;
      color: #FF6B35;
      border: 1px solid #FF6B35;
      box-shadow: none;
      margin-left: 10px;
    }
    .muted { font-size: 12px; color: #999; margin-top: 16px; }
    .err { color: #cf1322; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>用户行为看板</h1>
    <p>公网环境无法直连测试数仓 MCP，请改用<strong>内网看板</strong>（需连接公司网络或 VPN）。</p>

    <div class="tip" id="statusTip">正在准备跳转…</div>

    <div>
      <a class="btn" id="openBtn" href="#" target="_top" rel="noopener">打开内网看板</a>
      <button type="button" class="btn secondary" id="retryBtn">重新跳转</button>
    </div>
    <p class="err" id="errBox"></p>
    <p class="muted">
      内网地址配置见仓库根目录 <code>intranet-user-behavior.json</code>。<br>
      本机调试也可直接打开 <code>http://localhost:3010/dashboard-db.html</code>（需先启动服务）。
    </p>
  </div>

  <script>
    /**
     * 内网看板地址（优先读 intranet-user-behavior.json）
     * 未配置时不会自动跳转，只显示说明。
     */
    const FALLBACK_LOCAL = 'http://localhost:3010/dashboard-db.html';

    function go(url) {
      try {
        if (window.top && window.top !== window) {
          window.top.location.href = url;
        } else {
          location.href = url;
        }
      } catch (e) {
        location.href = url;
      }
    }

    async function loadIntranetUrl() {
      try {
        const res = await fetch('/intranet-user-behavior.json?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return '';
        const conf = await res.json();
        return (conf && conf.url ? String(conf.url).trim() : '');
      } catch (e) {
        return '';
      }
    }

    async function main() {
      const tip = document.getElementById('statusTip');
      const openBtn = document.getElementById('openBtn');
      const retryBtn = document.getElementById('retryBtn');
      const errBox = document.getElementById('errBox');

      const intranetUrl = await loadIntranetUrl();
      const target = intranetUrl || FALLBACK_LOCAL;

      openBtn.href = target;
      openBtn.onclick = function (e) {
        e.preventDefault();
        go(target);
      };
      retryBtn.onclick = function () {
        go(target);
      };

      if (!intranetUrl) {
        tip.innerHTML =
          '尚未配置正式内网地址。请先在内网机器启动服务，并把地址写入 <code>intranet-user-behavior.json</code> 的 <code>url</code> 字段后重新发布。<br>' +
          '当前可临时打开本机：<code>' + FALLBACK_LOCAL + '</code>';
        return;
      }

      tip.textContent = '已配置内网地址，正在跳转：' + intranetUrl;
      // 稍延时，方便在 iframe 里看到提示；然后顶层跳转
      setTimeout(function () { go(intranetUrl); }, 600);
    }

    main().catch(function (e) {
      const errBox = document.getElementById('errBox');
      errBox.style.display = 'block';
      errBox.textContent = e.message || String(e);
    });
  </script>
</body>
</html>
